<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chord Transposer & Capo Finder demo</title><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://sandymusiclab.com/tools/chord-transposer/"><link rel="stylesheet" href="style.css"></head><body>
